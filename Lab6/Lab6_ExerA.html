<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Rock, Paper, Scissors</title>
    <link rel="Lab6_ExerA.js" href="Lab6_ExerA.css" />
</head>
<body>
    <!-- Header -->
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Enter your name, click Start Game, then choose Rock, Paper, or Scissors.</p>
    </header>

    <!-- Input -->
    <section class="player-section">
        <label for = "playerName">Name:</label>
        <input type="text" id="playerName">
        <button onclick="startGame()">Start Game</button>
        <p id="welcomeMsg"></p>
    </section>

    <section>
        <button onclick="playRound('rock')">Rock</button>
        <button onclick="playRound('paper')">Paper</button>
        <button onclick="playRound('scissors')">Scissors</button>
        <div>
            <img id="playerImg" src="C:\Users\HP\Documents\GitHub\s81870_CSF3133_K1\Lab6">
            <img id="computerImg" src="C:\Users\HP\Documents\GitHub\s81870_CSF3133_K1\Lab6">
        </div>
    </section>

    <section>
        <p id="result"></p>
        <p>
            Wins: <span id="wins">0</span> | 
            Losses: <span id="losses">0</span> | 
            Draws: <span id="draws"></span>
        </p>
    </section>

    <section>
        <table id="history">
            <tr>
                <th>Round</th>
                <th>You</th>
                <th>Computer</th>
                <th>Result</th>
            </tr>
        </table>
        <br>
        <button onclick="showSummary()">Show Summary</button>
        <button onclick="resetGame()">Reset</button>
        <p id="summary"></p>
    </section>

    <footer>
        <p id="startTime"></p>
        <p>&copy; 2026 Computer Science Club</p>
    </footer>

    <script src="Lab6_ExerA.js"></script>
</body>
</html>
